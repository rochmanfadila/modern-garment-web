<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Soma Creative</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 sm:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
            <div>
                <h1 class="text-2xl font-black text-amber-500">Dashboard Pesanan Soma Creative</h1>
                <p class="text-xs text-slate-400 mt-1">Kelola status produksi dan pantau seluruh pesanan masuk dari pelanggan.</p>
            </div>
            <button onclick="loadOrders()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                <i class="fa-solid fa-rotate"></i> Refresh Data
            </button>
        </div>

        <!-- Tabel Pesanan -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-950 text-slate-400 uppercase tracking-wider font-bold border-b border-slate-700">
                        <tr>
                            <th class="p-4">No. Pesanan</th>
                            <th class="p-4">Tanggal</th>
                            <th class="p-4">Pelanggan</th>
                            <th class="p-4">Produk / Bahan</th>
                            <th class="p-4">Rincian Ukuran</th>
                            <th class="p-4">Total Biaya</th>
                            <th class="p-4">Status Produksi</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body" class="divide-y divide-slate-700 text-slate-200 font-medium">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-slate-400">Memuat data pesanan dari Google Sheets...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby6sCUc3ApfdG3p8P9ZDWwn2vTNNesaaoPHCqGPv_0IMPOiTMpMGYbRtP0VqJm4FxOx/exec";

        async function loadOrders() {
    const tbody = document.getElementById('orders-table-body');
    if (!tbody) return;

    try {
        // Ambil data terbaru dari Google Apps Script
        const response = await fetch(`${API_URL}?action=getOrders&_t=${Date.now()}`);
        const data = await response.json();

        if (data.ok && Array.isArray(data.orders)) {
            tbody.innerHTML = data.orders.map(o => `
                <tr class="hover:bg-slate-750 transition-colors border-b border-slate-700">
                    <td class="p-4 font-mono font-bold text-amber-400">${o.noPesanan || '-'}</td>
                    <td class="p-4 text-slate-400">${o.tanggal || '-'}</td>
                    <td class="p-4">
                        <strong class="text-white block">${o.nama || '-'}</strong>
                        <span class="text-[11px] text-slate-400">${o.wa || '-'}</span>
                    </td>
                    <td class="p-4">
                        <span class="block font-semibold">${o.produk || '-'}</span>
                        <span class="text-[11px] text-slate-400">${o.kain || '-'}</span>
                    </td>
                    <td class="p-4 font-mono text-[11px] text-sky-300">${o.ukuranStr || o.catatan || '-'}</td>
                    <td class="p-4 font-bold text-emerald-400">${o.totalHarga || '-'}</td>
                    <td class="p-4">
                        <select onchange="updateStatus('${o.noPesanan}', this.value)" class="bg-slate-900 border border-slate-600 rounded-lg p-2 text-xs font-semibold text-white focus:outline-none focus:border-amber-500">
                            <option value="Konsultasi / DP" ${ (o.status || '').includes('DP') ? 'selected' : ''}>Konsultasi / DP</option>
                            <option value="Potong Kain" ${ (o.status || '').includes('Potong') ? 'selected' : ''}>Potong Kain</option>
                            <option value="Jahit & Cetak" ${ (o.status || '').includes('Jahit') || (o.status || '').includes('Cetak') ? 'selected' : ''}>Jahit & Cetak</option>
                            <option value="Finishing & QC" ${ (o.status || '').includes('Finishing') ? 'selected' : ''}>Finishing & QC</option>
                            <option value="Selesai / Pengiriman" ${ (o.status || '').includes('Selesai') || (o.status || '').includes('Kirim') ? 'selected' : ''}>Selesai / Pengiriman</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }
    } catch (err) {
        console.error("Gagal load data admin:", err);
    }
}

        async function updateStatus(noPesanan, newStatus) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "updateStatus", noPesanan: noPesanan, status: newStatus })
                });
                const res = await response.json();
                if (res.ok) {
                    alert(`✅ Status pesanan ${noPesanan} berhasil diubah menjadi: ${newStatus}`);
                } else {
                    alert("Gagal memperbarui status: " + (res.error || 'Terjadi kesalahan'));
                }
            } catch (err) {
                alert("Kesalahan koneksi saat memperbarui status.");
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
