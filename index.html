<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma Creative | Custom Clothing & Konveksi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        dark: {
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                        accent: {
                            500: '#f97316',
                            600: '#ea580c',
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="font-inter bg-slate-50 text-slate-800 antialiased selection:bg-primary-500 selection:text-white">
    <div id="header-container"></div>

    <main>
        <div id="hero-container"></div>
        <div id="features-container"></div>
        <div id="custom-order-container"></div>
        <div id="catalog-container"></div>
        <div id="tracking-container"></div>
        <div id="contact-container"></div>
    </main>

    <div id="footer-container"></div>

    <script src="assets/js/main.js"></script>

    <!-- SCRIPT UTAMA KONTROL SISTEM, BACKEND GOOGLE SHEETS & WHATSAPP -->
    <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby6sCUc3ApfdG3p8P9ZDWwn2vTNNesaaoPHCqGPv_0IMPOiTMpMGYbRtP0VqJm4FxOx/exec";

    async function loadComponent(elementId, filePath) {
        const el = document.getElementById(elementId);
        if (!el) return;
        try {
            let res = await fetch(filePath);
            if (!res.ok) res = await fetch(`./${filePath}`);
            if (res.ok) {
                el.innerHTML = await res.text();
                if (window.lucide) lucide.createIcons();
            }
        } catch (err) {
            console.error(`Error loading ${filePath}:`, err);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        await loadComponent('header-container', 'components/header.html');
        await loadComponent('hero-container', 'components/hero.html');
        await loadComponent('features-container', 'components/features.html');
        await loadComponent('custom-order-container', 'components/custom-order.html');
        await loadComponent('catalog-container', 'components/catalog.html');
        await loadComponent('tracking-container', 'components/tracking.html');
        await loadComponent('contact-container', 'components/contact.html');
        await loadComponent('footer-container', 'components/footer.html');

        // BINDING EVENT ONCLICK TOMBOL SUBMIT WA
        setTimeout(initSubmitHandler, 500);
    });

    function initSubmitHandler() {
        const btn = document.getElementById('btn-submit-order') || document.querySelector('button[type="submit"]') || document.querySelector('.btn-order');
        if (!btn) return;

        btn.onclick = async function (e) {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = "Memproses Pesanan...";

            // 1. Ambil Nilai Form
            const produk = document.getElementById('sum-product')?.innerText || 'Kaos (T-Shirt)';
            const kain = document.getElementById('sum-fabric')?.innerText || 'Cotton Combed 30s';
            const warna = document.getElementById('cust-color')?.value || document.querySelector('input[placeholder*="Warna"]')?.value || 'Hitam';
            const aplikasi = document.getElementById('sum-print')?.innerText || 'Sablon 1 Sisi';
            const linkDesain = document.getElementById('cust-design')?.value || 'Tidak ada link';
            const totalHarga = document.getElementById('sum-total')?.innerText || 'Rp 0';
            const nama = document.getElementById('cust-name')?.value || 'Pelanggan Soma';
            const wa = document.getElementById('cust-wa')?.value || '085732915213';

            // 2. Format Ukuran
            let rincianUkuranArr = [];
            let totalQtyPcs = 0;
            const sizeInputs = document.querySelectorAll('#size-inputs input, input[id*="size"], input[name*="size"]');

            sizeInputs.forEach(inp => {
                const val = parseInt(inp.value) || 0;
                if (val > 0) {
                    let label = inp.getAttribute('data-size') || inp.id.replace('size-', '').toUpperCase();
                    rincianUkuranArr.push(`${label}: ${val} Pcs`);
                    totalQtyPcs += val;
                }
            });

            const rincianText = rincianUkuranArr.length > 0 ? rincianUkuranArr.join(', ') : `${totalQtyPcs || 12} Pcs`;
            const noResi = "KNF-" + Date.now().toString().slice(-6);

            // 3. Kirim ke Google Sheets
            try {
                await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        nama: nama,
                        wa: wa,
                        produk: produk,
                        kain: kain,
                        warna: warna,
                        aplikasi: aplikasi,
                        rincianUkuran: rincianText,
                        linkDesain: linkDesain,
                        totalHarga: totalHarga,
                        noPesanan: noResi
                    })
                });
            } catch (err) {
                console.warn("Gagal simpan ke sheets:", err);
            }

            // 4. Buka WhatsApp dengan Format Rinci
            const waMsg = 
`Halo Soma Creative, saya ingin melakukan pemesanan custom dengan detail sebagai berikut:

*NO. RESI:* ${noResi}

*DETAIL PRODUK*
• Jenis: ${produk}
• Bahan: ${kain}
• Warna: ${warna}
• Aplikasi: ${aplikasi}

*JUMLAH & UKURAN*
• Kuantitas Total: ${totalQtyPcs || 12} Pcs
• Detail Ukuran: ${rincianText}

*DESAIN & BIAYA*
• Link File: ${linkDesain}
• Estimasi Total: ${totalHarga}

Mohon info lebih lanjut untuk proses fiksasi desain dan pembayaran. Terima kasih!`;

            window.open(`https://wa.me/6285732915213?text=${encodeURIComponent(waMsg)}`, '_blank');

            // Reset Tombol
            btn.disabled = false;
            btn.innerText = "Pesan via WhatsApp";
        };
    }
</script>
</body>
</html>
